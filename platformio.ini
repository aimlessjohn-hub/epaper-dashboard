; epaper_dashboard - Waveshare ESP32-S3-ePaper-1.54 (V2, N8R8)
; Phase 1 MVP: Deep Sleep -> WiFi -> :8123/status -> E-Ink -> Deep Sleep
[env:esp32s3_epaper]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Waveshare-Beispiele kompilieren mit Arduino-ESP32 3.x (IDF5.x)
monitor_speed = 115200
; OPI-PSRAM (N8R8) - qio_opi Pflicht, setCpuFrequencyMhz TABU (RLCD-Lektion)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
lib_extra_dirs =
    lib
monitor_filters = esp32_exception_decoder
upload_port = /dev/ttyACM0